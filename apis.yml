aid: agriconomie
name: Agryco
description: 'Agryco — trading as Agriconomie until its September 2024 rebrand — is a
  French online marketplace and e-commerce platform that sells agricultural supplies
  direct to farmers: mineral, organic and foliar fertilizers, conventional and organic
  seeds, phytosanitary products, animal nutrition and livestock equipment, plus tractor,
  spraying, harvesting and soil-working spare parts. Founded in 2014 by Clement Le
  Fournis, Dinh Nguyen and Paolin Pascot, the company operates a one-stop procurement
  site for professional farmers across France, Belgium, Germany, Spain and Italy,
  wrapping the catalog in advisory services (agronomy experts on the phone six days
  a week), fertilizer blending, equipment valuation and 60-day payment terms. It raised
  a EUR 60 million Series B in 2022 co-led by Treis Group, Temasek and Aliment Capital
  with Eurazeo participating, and publishes the Agrycomag technical magazine at
  agryco.com/blog. Agryco is an end-user commerce product: as of this profile it
  publishes no public developer program, API reference, SDK or machine-readable
  specification.'
